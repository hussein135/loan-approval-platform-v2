{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Loan Approval Platform{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'loans/css/style.css' %}">
</head>
<body>
<header>
    <div class="header-content">
        <h2>Loan Approval Prediction Platform</h2>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'create_application' %}">New Application</a>

            {% if user.is_staff %}
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <a href="{% url 'application_list' %}">Applications</a>
                <a href="{% url 'review_dashboard' %}">Review Dashboard</a>
                <a href="/admin/">Admin</a>
            {% endif %}
        </nav>
    </div>
</header>

<main class="container">
    <div class="page-card">
        {% block content %}{% endblock %}
    </div>
</main>
</body>
</html>
